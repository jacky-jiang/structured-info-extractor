[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-extractor"
version = "0.1.0"
description = "LLM structured information extraction practice"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3"]

[project.scripts]
event-extract = "event_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
